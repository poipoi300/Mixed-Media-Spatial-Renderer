[package]
name = "shape_api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The control-panel schema is shared with the viewer, so the two cannot drift.
spatial_api = { path = "../spatial_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking, dependency-light HTTP. This crate ships as the viewer's reference
# server, so it stays free of an async runtime.
tiny_http = { version = "0.12", default-features = false }
